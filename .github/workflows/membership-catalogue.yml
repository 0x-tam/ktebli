name: Membership public catalogue

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Approved source scope (coverage stays source-specific)"
        type: choice
        default: all
        options:
          - all
          - lebanon
          - worldbank
          - mawred
          - ungm-curated
          - ppa
          - grants-gov
      recent_details:
        description: "PPA recent locale-detail request limit (1–500)"
        type: choice
        default: "300"
        options: ["1", "10", "20", "50", "100", "300", "500"]
      backlog_details:
        description: "PPA historical locale-detail request limit (1–300)"
        type: choice
        default: "40"
        options: ["1", "10", "20", "40", "100", "300"]

permissions:
  contents: read

concurrency:
  group: membership-public-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    # Activation is a repository variable, initially absent/false. A manual
    # dispatch can qualify the runner before turning on the daily schedule.
    if: github.event_name == 'workflow_dispatch' || vars.MEMBERSHIP_CATALOG_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: membership-catalogue
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.4"
          package-manager-cache: false
      - name: Install pinned catalogue dependencies
        run: |
          npm ci --ignore-scripts --prefix membership
          npm ci --ignore-scripts --prefix membership/crawler
      - name: Verify dedicated ingestion configuration
        env:
          INGEST_DATABASE_URL: ${{ secrets.MEMBERSHIP_INGEST_DATABASE_URL }}
        run: test -n "$INGEST_DATABASE_URL"
      - name: Refresh and import official public notices
        working-directory: membership
        env:
          INGEST_DATABASE_URL: ${{ secrets.MEMBERSHIP_INGEST_DATABASE_URL }}
          MEMBERSHIP_EXPECTED_DB_HOST: ep-autumn-feather-b1fk17te.c-5.eu-central-1.aws.neon.tech
          # Daily scope uses the individually qualified sources and PPA bounds.
          # Grants.gov catch-up remains an independent manual selection.
          CATALOGUE_SOURCES: ${{ (github.event_name == 'schedule' || inputs.sources == 'lebanon') && 'worldbank,mawred,ungm-curated,ppa' || inputs.sources == 'all' && 'worldbank,mawred,ungm-curated,ppa,grants-gov' || inputs.sources || 'worldbank,mawred,ungm-curated,ppa' }}
          CATALOGUE_RECENT_DETAILS: ${{ github.event_name == 'schedule' && '20' || inputs.recent_details || '300' }}
          CATALOGUE_BACKLOG_DETAILS: ${{ github.event_name == 'schedule' && '1' || inputs.backlog_details || '40' }}
        run: npm run catalog:scheduled
