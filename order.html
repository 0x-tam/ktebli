<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your order — Ktebli</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='36' rx='7' fill='none' stroke='%231F9E5A' stroke-width='6' transform='rotate(-6 32 32)'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' font-weight='bold' fill='%231F9E5A' text-anchor='middle' transform='rotate(-6 32 32)'%3EK!%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{--bg:#FAF8F2;--mint:#E9EFE4;--green:#356347;--forest:#284D39;--coral:#C45141;--ink:#20392F;--grey:#59695F;--line:#D9DED4;--surface:#FFFEFA}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:0 24px 76px}
nav{border-bottom:1px solid var(--line);background:rgba(250,248,242,.96)}
nav .wrap{display:flex;align-items:center;height:68px;padding-bottom:0}
.order-return{margin-left:auto;color:var(--forest);font-weight:700;font-size:.88rem;text-underline-offset:3px}
.stamp{font-family:'Fraunces',serif;font-weight:700;font-size:20px;color:var(--forest);border:1.5px solid var(--forest);border-radius:6px;padding:4px 11px 5px;transform:rotate(-2deg);text-decoration:none;letter-spacing:.02em}
.stamp .dot{color:var(--coral)}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,42px);margin:34px 0 8px;letter-spacing:-.035em;line-height:1.14}
.meta{color:var(--grey);margin-bottom:4px;font-size:.9rem}
.ordno{font-weight:700;color:var(--ink)}
.chip{min-height:30px;display:inline-flex;align-items:center;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:100px;margin:10px 0 24px}
.chip.processing{background:#F7EFD9;color:#76571F}
.chip.complete{background:var(--mint);color:var(--forest)}
.chip.attention{background:#F8E9E4;color:#773D34}
.comfort{background:var(--mint);border:1px solid #cbd8c8;border-radius:10px;padding:13px 16px;font-size:.88rem;color:var(--forest);margin:-10px 0 22px}
.buyer-notice{background:var(--surface);border:1px solid #ccd8c9;border-radius:11px;padding:18px 20px;margin:0 0 22px}
.buyer-notice h2{font-family:'Fraunces',serif;font-size:1.35rem;line-height:1.25;margin-bottom:7px}
.buyer-notice p{font-size:.9rem;margin:9px 0}
.buyer-notice ul{margin:8px 0 12px 21px;font-size:.9rem}
.buyer-notice a{color:var(--forest);font-weight:700;overflow-wrap:anywhere;text-underline-offset:3px}
.pcard{background:var(--surface);border:1px solid var(--ink);border-radius:14px;margin-bottom:22px;overflow:hidden;box-shadow:5px 5px 0 var(--green)}
.pcard.attention{box-shadow:5px 5px 0 var(--coral)}
.phead{background:var(--forest);color:#fff;padding:13px 20px;font-weight:700;font-size:.92rem;display:flex;justify-content:space-between;gap:12px}
.pbody{padding:9px 20px 18px}
.stage{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.stage:last-child{border-bottom:none}
.ic{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;margin-top:1px}
.ic.done{background:var(--mint);color:var(--forest)}
.ic.running{border:2px solid var(--line);border-top-color:var(--green);animation:sp 1s linear infinite}
.ic.pending{border:2px solid var(--line)}
.ic.held,.ic.failed{background:#F7EFD9;color:#76571F}
@keyframes sp{to{transform:rotate(360deg)}}
.stage .lbl{flex:1}
.stage.pending .lbl{color:#66756B}
.stage .note{display:block;font-size:.8rem;color:#76571F}
.stage .t{font-size:.78rem;color:var(--grey);flex:0 0 auto}
.files{background:var(--mint);border-top:1px solid var(--line);padding:16px 20px}
.files .ft{font-weight:700;margin:10px 0 8px;color:var(--forest)}
.files .ft:first-child{margin-top:0}
.fbtn{min-height:44px;display:inline-flex;align-items:center;background:var(--forest);color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:9px 16px;border-radius:8px;margin:0 8px 8px 0;box-shadow:0 2px 0 #183B2A}
.fbtn:hover{background:#193c2b}
.revzone{border-top:1px solid var(--line);padding:16px 20px;background:var(--surface)}
.revbtn{min-height:44px;background:transparent;color:var(--ink);border:1px solid #849488;font-weight:700;font-size:.88rem;padding:9px 17px;border-radius:8px;cursor:pointer;font-family:inherit}
.revbtn{display:inline-flex;align-items:center;gap:9px}
.revbtn:hover{background:var(--forest);border-color:var(--forest);color:#fff}
.revleft{font-size:.84rem;color:var(--grey);margin-top:8px}
.revform{display:none;margin-top:16px}
.revform.open{display:block}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.opt{min-height:44px;display:inline-flex;align-items:center;font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;user-select:none}
.opt.sel{border-color:var(--green);background:var(--mint);color:var(--forest);font-weight:700}
.revform textarea{width:100%;border:1px solid #9eaa9f;border-radius:9px;padding:11px 13px;font-family:inherit;font-size:16px;min-height:100px;resize:vertical;background:#fff}
.revform textarea:focus{outline:3px solid #8C5739;outline-offset:2px;border-color:var(--green)}
.revsend{min-height:46px;display:inline-flex;align-items:center;gap:9px;margin-top:10px;background:var(--forest);color:#fff;border:1px solid var(--forest);font-weight:700;font-size:.9rem;padding:10px 19px;border-radius:8px;cursor:pointer;font-family:inherit;box-shadow:0 2px 0 #183B2A}
.revsend:hover{background:#193c2b}
.bigmsg{background:var(--surface);border:1px solid var(--ink);border-radius:14px;padding:30px;text-align:center;box-shadow:5px 5px 0 var(--green)}
.bigmsg h2{font-family:'Fraunces',serif;font-size:1.5rem;margin-bottom:8px}
.bigmsg p{color:var(--grey)}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
.foot{margin-top:27px;font-size:.86rem;color:var(--grey)}
.foot a{color:var(--forest);text-underline-offset:3px}
.paid-intake h3{font-family:'Fraunces',serif;font-size:1.4rem;line-height:1.25;margin:22px 0 12px}
.paid-intake .field{margin:16px 0}
.paid-intake label{display:block;font-size:.88rem;font-weight:600;margin-bottom:7px}
.paid-intake input:not([type=checkbox]),.paid-intake select,.paid-intake textarea{width:100%;font:inherit;font-size:16px;border:1px solid #9eaa9f;border-radius:8px;padding:11px 12px;min-height:48px;background:white;color:var(--ink)}
.paid-intake textarea{min-height:100px}
.paid-intake input:focus-visible,.paid-intake select:focus-visible,.paid-intake textarea:focus-visible{outline:3px solid #8C5739;outline-offset:2px;border-color:var(--green)}
.paid-intake .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.paid-intake .checkrow{min-height:44px;display:flex;gap:10px;margin:15px 0;align-items:center}
.paid-intake .checkrow input{width:20px;height:20px;min-height:20px;margin:4px 0 0;accent-color:var(--forest)}
.paid-intake .checkrow label{font-weight:400}
.paid-intake .optional,.paid-intake .pill{font-size:.75rem;color:var(--grey);font-weight:400}
.paid-intake .hint{display:block;font-size:.82rem;color:var(--grey);font-weight:400}
.paid-intake details{border-top:1px solid var(--line);padding:16px 0}
.paid-intake summary{min-height:44px;display:inline-flex;align-items:center;cursor:pointer;font-weight:700}
.paid-intake summary{gap:10px;list-style:none}
.paid-intake summary::-webkit-details-marker{display:none}
.paid-intake summary::after{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;content:"";transform:rotate(45deg) translateY(-2px);transition:transform .16s ease}
.paid-intake details[open]>summary::after{transform:rotate(225deg) translateY(-2px)}
.paid-intake .rep-row{display:flex;gap:8px;margin-bottom:8px}
.paid-intake .rep-fields{display:flex;flex:1;gap:8px;flex-wrap:wrap}
.paid-intake .rep-fields input{flex:1;min-width:120px}
.paid-intake button{cursor:pointer}
.paid-intake .field-help{font-size:.82rem;color:var(--grey)}
.paid-intake .rep-add,.paid-intake .rep-x{min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--forest);font:600 .84rem 'DM Sans',sans-serif}
.paid-intake .rep-add:hover,.paid-intake .rep-x:hover{background:var(--mint)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #8C5739;outline-offset:3px}
.order-next{margin:0 0 14px;padding:12px 14px;border-left:3px solid var(--green);background:var(--mint);color:var(--forest);font-size:.9rem}
.source-summary{margin-top:18px}
.deadline-alert{margin:0 0 16px;padding:12px 14px;border-left:3px solid var(--coral);background:#f8e9e4;color:#773d34;font-size:.88rem}
.source-details{margin:0 0 22px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.source-details>summary{min-height:48px;display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;color:var(--forest);font-weight:700}
.source-details>summary::-webkit-details-marker{display:none}
.source-details>summary::after{width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;content:"";transform:rotate(45deg) translateY(-2px)}
.source-details[open]>summary::after{transform:rotate(225deg) translateY(-2px)}
.source-details>.buyer-notice{padding:14px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.poll-error{display:flex;align-items:flex-start;gap:10px;margin:14px 0;padding:12px 14px;border:1px solid #dfb8ad;border-radius:9px;background:#fbefeb;color:#773d34;font-size:.88rem}
.poll-error[hidden]{display:none}
.poll-error svg{width:18px;height:18px;flex:0 0 auto;margin-top:2px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.revmessage{min-height:1.5em;margin:8px 0 0;font-size:.84rem;color:var(--grey)}
.revmessage.error{color:#8d3e32}
.revmessage.success{color:var(--forest)}
.revmessage.pending{color:var(--grey)}
.opts .opt{appearance:none;background:transparent;color:var(--ink);font-family:inherit;text-align:left;transition:color .18s ease,background-color .18s ease,border-color .18s ease,transform .12s ease}
.opts .opt:hover{background:var(--mint);border-color:var(--green)}
.opts .opt:active{transform:translateY(1px)}
.opts .opt.sel{border-color:var(--green);background:var(--mint);color:var(--forest);font-weight:700}
.fbtn,.revbtn,.revsend,.paid-intake summary,.stamp{transition:color .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .12s ease}
.fbtn:active,.revbtn:active,.revsend:active{transform:translateY(1px)}
.fbtn svg,.revbtn svg,.revsend svg,.rep-x svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fbtn{gap:8px}
.paid-intake details[open]:not(.poll-restored)>:not(summary),.source-details[open]:not(.poll-restored)>.buyer-notice{animation:details-enter .18s ease-out both}
@keyframes details-enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
button,a,summary{transition:color .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease,transform .12s ease}
button:active:not(:disabled),.fbtn:active,.stamp:active{transform:translateY(1px)}
button:disabled{cursor:not-allowed;opacity:.64}
@media(prefers-reduced-motion:reduce){.paid-intake details[open]>:not(summary),.source-details[open]>.buyer-notice{animation:none}}

@media(max-width:600px){.wrap{padding-right:18px;padding-left:18px}.paid-intake .two{grid-template-columns:1fr;gap:0}.paid-intake .rep-row{flex-wrap:wrap}.phead,.pbody,.files,.revzone{padding-right:16px;padding-left:16px}.stage{gap:9px;font-size:.85rem}.stage .t{font-size:.7rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<template id="paid-intake-template"><section class="buyer-notice paid-intake" id="paid-intake"><h2>A little about the work you want to propose</h2><p>We can read the opportunity while you complete this. Your proposal type, currency and work description are required before writing starts. Leave anything else blank if you do not know it.</p><form id="intake-form"><div class="two"><div class="field"><label for="w-proposal-type">Proposal type · Required</label><select id="w-proposal-type" required><option value="">Choose…</option><option value="grant">Grant application</option><option value="government_tender">Government tender</option><option value="procurement">Procurement / RFP</option><option value="business">Business / service proposal</option></select></div><div class="field"><label for="w-currency">Proposal currency · Required</label><select id="w-currency" required><option value="">Choose…</option><option value="USD">USD — US dollar</option><option value="LBP">LBP — Lebanese pound</option><option value="EUR">EUR — Euro</option><option value="GBP">GBP — British pound</option><option value="other">Other currency</option></select><div id="paid-currency-other" hidden><label for="w-currency-other">Three-letter currency code</label><input id="w-currency-other" maxlength="3" pattern="[A-Za-z]{3}" placeholder="e.g. AED" disabled></div><p id="source-field-note" class="field-help"></p></div></div><div class="field"><label for="w-response-language">Proposal and document language · Required</label><select id="w-response-language" required><option value="">Choose English or Arabic…</option><option value="en">English</option><option value="ar">العربية — Arabic</option></select><p id="language-help" class="field-help">The issuer’s required submission language takes priority. If none is stated, choose English or Arabic.</p></div>
        <div class="field"><label for="w-activity">What work do you intend to propose? <span class="rq">Required</span></label><input type="text" id="w-activity" minlength="20" required aria-describedby="w-activity-help" placeholder="e.g. survey three public buildings and produce a phased retrofit plan"><p class="field-help" id="w-activity-help">Describe the work you will deliver. Add background below if useful.</p></div>
        <details class="work-background" data-poll-key="work-background"><summary>Delivery setting and past work <span class="optional">Optional</span></summary>
          <div class="field"><label for="w-place">Where will you deliver the work? <span class="optional">Optional</span></label><input type="text" id="w-place" placeholder="e.g. Tripoli municipal offices, a client site in Beirut, or online"></div>
          <div class="field"><label for="w-venue">Where does it actually happen? <span class="optional">Optional</span><span class="hint">Name the client site, facility, service area or delivery setting. Choose online if the work is remote.</span></label><input type="text" id="w-venue" placeholder="e.g. the New Horizons Centre on Hazel Road">
            <div style="margin-top:8px"><label style="font-weight:400;font-size:14px;color:var(--grey)">…or, if there is no fixed venue:</label>
              <select id="w-venue-escape">
                <option value="">There is a fixed venue (named above)</option>
                <option value="homes">We work in people's own homes</option>
                <option value="street">We do street-based outreach</option>
                <option value="outdoors">We work outdoors</option>
                <option value="mobile">We work from a vehicle</option>
                <option value="online">We work online</option>
              </select>
            </div>
          </div>
          <div class="field"><label for="w-last-what">The last work you or your organisation delivered — what was it called? <span class="optional">Optional</span></label><input type="text" id="w-last-what" placeholder="e.g. the Cedar Office refurbishment or the Harbour training programme">
            <div class="checkrow" style="margin-top:8px"><input type="checkbox" id="w-never"><label for="w-never">I / we have not delivered a project yet — write it as our first, with no track record.</label></div>
          </div>
          <div class="field"><label for="w-last-when">Roughly when was that? <span class="optional">Optional</span></label><input type="text" id="w-last-when" placeholder="e.g. winter 2024; since March 2023"></div>
          <div class="field"><label for="w-trigger">What need or problem does this work address? <span class="optional">Optional</span><span class="hint">Explain the client’s need, the procurement objective or the community issue in your own words.</span></label><textarea id="w-trigger" placeholder="e.g. the client needs to reduce building energy use while keeping offices open throughout the works."></textarea></div>
        </details>

      <details data-poll-key="governance"><summary>Governance &amp; assurances <span class="optional">Optional</span></summary>
        <h3>Governance &amp; assurances</h3>
        <p class="ws-sub">Confirm only facts that are true and relevant to your opportunity. A grant, tender or client brief may require different assurances. Leave anything unconfirmed blank; these answers do not replace required certificates or signatures.</p>
        <div class="checkrow"><input type="checkbox" id="w-sg-policy"><label for="w-sg-policy"><b>We have a written safeguarding policy in place.</b></label></div>
        <div class="two">
          <div class="field"><label for="w-dsl-name">Designated Safeguarding Lead — name</label><input type="text" id="w-dsl-name" placeholder="e.g. Amina Yusuf"></div>
          <div class="field"><label for="w-dsl-role">Their role <span class="pill">optional</span></label><input type="text" id="w-dsl-role" placeholder="e.g. Deputy Chair"></div>
        </div>
        <div class="field"><label for="w-dsl-training">Their safeguarding training <span class="pill">optional</span></label><input type="text" id="w-dsl-training" placeholder="e.g. Level 3 safeguarding"></div>
        <div class="checkrow"><input type="checkbox" id="w-bank"><label for="w-bank">We hold a bank account in the organisation's own name, with unrelated signatories.</label></div>
        <div class="checkrow"><input type="checkbox" id="w-pli"><label for="w-pli">We hold Public Liability Insurance.</label></div>
        <div class="checkrow"><input type="checkbox" id="w-board"><label for="w-board">We are an independent organisation, with our Board in full control.</label></div>
        <div class="checkrow"><input type="checkbox" id="w-noconflict"><label for="w-noconflict">For grant applications: we have no conflicting live grant with this funder.</label></div>
        <div class="two">
          <div class="field"><label for="w-annual-income">Latest annual revenue or income <span class="pill">optional</span></label><input type="text" id="w-annual-income" placeholder="e.g. USD 240,000"></div>
          <div class="field"><label for="w-accounts">Latest filed accounts cover <span class="pill">optional</span></label><input type="text" id="w-accounts" placeholder="e.g. year ending 31 March 2025"></div>
        </div>
        <div class="field"><label for="w-lived">People with lived experience in your governance <span class="pill">optional</span></label><input type="text" id="w-lived" placeholder="e.g. three trustees are former service users"></div>
      </details>

      <details data-poll-key="track-record"><summary>People, projects &amp; track record <span class="optional">Optional</span></summary>
        <h3>Your people, projects &amp; track record</h3>
        <p class="ws-sub">The named facts that let us write about your organisation without inventing anyone. Add as many as are true — leave the rest blank.</p>
        <div class="field"><label>Key people <span class="pill">optional</span><span class="hint">Directors, specialists, project leads and coordinators your proposal can name.</span></label>
          <div class="rep" id="rep-people"></div>
          <button type="button" class="rep-add" id="add-people">+ Add a person</button>
        </div>
        <div class="field"><label>Projects, programmes or services <span class="pill">optional</span><span class="hint">Each named service, with a one-line scope.</span></label>
          <div class="rep" id="rep-programmes"></div>
          <button type="button" class="rep-add" id="add-programmes">+ Add a project or service</button>
        </div>
        <div class="field"><label>Results you can point to <span class="pill">optional</span><span class="hint">A figure, what it counts, and when. Only what you can stand behind.</span></label>
          <div class="rep" id="rep-results"></div>
          <button type="button" class="rep-add" id="add-results">+ Add a result</button>
        </div>
        <div class="field"><label>Partnerships <span class="pill">optional</span></label>
          <div class="rep" id="rep-partners"></div>
          <button type="button" class="rep-add" id="add-partners">+ Add a partner</button>
        </div>
        <div class="field"><label>Extra links on your own site <span class="pill">optional</span><span class="hint">Annual reports, team profiles, case studies and project pages on your own website.</span></label>
          <div class="rep" id="rep-links"></div>
          <button type="button" class="rep-add" id="add-links">+ Add a link</button>
        </div>
        <div class="field">
          <label for="w-directions">Anything to emphasise or avoid? <span class="pill">optional</span>
            <span class="hint">e.g. highlight a strength, avoid mentioning something, keep the tone more formal.</span>
          </label>
          <textarea id="w-directions" placeholder="Your directions, in your own words."></textarea>
        </div>
      </div>
      </details>

        <details class="intake-extra" data-poll-key="organization-details">
          <summary>Additional organisation details <span class="optional">Optional</span></summary>
          <p class="field-help">Useful when the opportunity asks about your legal status or financial capacity.</p>
          <div class="two">
            <div class="field"><label for="w-income-band">Annual revenue range</label><input type="text" id="w-income-band" placeholder="e.g. USD 100,000–500,000"></div>
            <div class="field"><label for="w-legal">Legal form</label>
            <select id="w-legal">
              <option value="">Choose…</option>
              <option>Limited company</option><option>Partnership</option><option>Sole proprietor</option><option>Public institution</option>
              <option>Charitable Incorporated Organisation (CIO)</option>
              <option>Charitable company (limited by guarantee)</option>
              <option>Unincorporated association</option>
              <option>Community Interest Company (CIC)</option>
              <option>Trust</option>
              <option>Other</option>
            </select>
            </div>
          </div>

        h += '<br>Drawing pages: ' + s.drawing_pages.map(function(page){ return '<a href="' + esc(pdfPageUrl(s.url,page)) + '" target="_blank" rel="noopener noreferrer">' + page + '</a>'; }).join(', ');
      }
      h += '</li>';
    });
    h += '</ul><p>These documents guide the requirement checks. If we need more from your team, we will ask for the specific item.</p></section>';
  }
  if(d.pdf_answers && d.pdf_answers.length){
    h += '<section class="buyer-notice"><h2>Reviewed passages</h2><p>These excerpts help guide the proposal. They do not replace the full requirement checks.</p>';
    d.pdf_answers.forEach(function(answer){h+='<h3>'+esc(answer.label)+'</h3>';if(answer.status==='unknown')h+='<p>No clear answer in the reviewed shortlist.</p>';else (answer.passages||[]).forEach(function(p){var url;try{url=new URL(p.source_url);if(!['http:','https:'].includes(url.protocol))return;}catch{return;}if(p.page)url.hash='page='+p.page;h+='<blockquote>'+esc(p.quote)+'</blockquote><p><a href="'+esc(url.href)+'" target="_blank" rel="noopener noreferrer">View source'+(p.page?' · page '+esc(p.page):'')+'</a></p>'; });});
    h+='</section>';
  }
  if ((d.buyer_notice_sources && d.buyer_notice_sources.length) || (d.pdf_answers && d.pdf_answers.length)) h += '</details>';
  app.innerHTML = h;lastRenderKey=renderKey;
  if(d.intake && d.intake.required) setupIntake(d);

  // wire revision UI
  app.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){
      var pid = b.getAttribute('data-open');
      var state=formState[pid]||{opts:[],details:'',open:false,pending:false,sent:false,message:'',messageType:''};formState[pid]=state;
      state.open=!state.open;b.setAttribute('aria-expanded',state.open?'true':'false');
      document.getElementById('rf-' + pid).classList.toggle('open',state.open);
      saveOrderDraft();
    });
  });
  app.querySelectorAll('.opt').forEach(function(el){
    el.addEventListener('click', function(){
      var pid = el.getAttribute('data-pid'), op = el.getAttribute('data-op');
      var state=formState[pid]||{opts:[],details:'',open:true,pending:false,sent:false,message:'',messageType:''};formState[pid]=state;
      var i = state.opts.indexOf(op);
      if (i >= 0) state.opts.splice(i,1); else state.opts.push(op);
      if(!state.requestMarker)state.requestMarker=revisionMarker(latestOrderData,pid);
      state.sent=false;if(!state.uncertain&&!state.stale){state.message='';state.messageType='';}
      var selected=state.opts.indexOf(op)>=0;el.classList.toggle('sel',selected);el.setAttribute('aria-pressed',selected?'true':'false');
      var send=document.getElementById('rs-'+pid);if(send){send.disabled=state.pending||state.stale||(state.uncertain&&!state.retryAllowed);setControlLabel(send,state.pending?'Sending…':'Send revision request');}
      app.querySelectorAll('[data-pid]').forEach(function(control){if(control.getAttribute('data-pid')===pid)control.disabled=state.pending||state.sent||state.blocked;});
      if(state.sent||state.blocked){var lockedText=document.getElementById('rd-'+pid);if(lockedText)lockedText.disabled=true;}
      var message=document.getElementById('rm-'+pid);if(message){message.textContent=state.message;message.className='revmessage '+state.messageType;}
      saveOrderDraft();
    });
  });
  app.querySelectorAll('[data-send]').forEach(function(b){
    b.addEventListener('click', function(){ submitRevision(b.getAttribute('data-send')); });
  });
  app.querySelectorAll('[data-review-revision]').forEach(function(b){b.addEventListener('click',function(){var pid=b.getAttribute('data-review-revision'),state=formState[pid];if(!state)return;state.stale=false;state.requestMarker=revisionMarker(latestOrderData,pid);state.message='Latest version reviewed. Your draft is ready when you are.';state.messageType='success';lastRenderKey=null;render(latestOrderData);saveOrderDraft();});});
  app.querySelectorAll('[data-recover-revision]').forEach(function(b){b.addEventListener('click',function(){var pid=b.getAttribute('data-recover-revision'),saved=orderDraft&&orderDraft.revisions&&orderDraft.revisions[pid];if(!saved)return;formState[pid]={opts:saved.opts.slice(),details:saved.details,open:true,pending:false,sent:false,requestMarker:saved.marker,stale:true,uncertain:false,message:'Review your saved request against the latest version before sending.',messageType:'pending'};lastRenderKey=null;render(latestOrderData);saveOrderDraft();});});
  app.querySelectorAll('[data-check-revision]').forEach(function(b){b.addEventListener('click',function(){checkRevisionBeforeRetry(b.getAttribute('data-check-revision'));});});

  // keep textarea edits across polls
  app.querySelectorAll('.revform textarea').forEach(function(t){
    t.addEventListener('input', function(){
      var pid = t.id.slice(3);
      var state=formState[pid]||{opts:[],details:'',open:true,pending:false,sent:false,message:'',messageType:''};formState[pid]=state;
      state.details = t.value;if(!state.requestMarker)state.requestMarker=revisionMarker(latestOrderData,pid);state.sent=false;
      if(state.messageType==='success'){state.message='';state.messageType='';}
      var send=document.getElementById('rs-'+pid);if(send){send.disabled=state.pending||state.stale||(state.uncertain&&!state.retryAllowed);setControlLabel(send,state.pending?'Sending…':'Send revision request');}
      app.querySelectorAll('[data-pid]').forEach(function(control){if(control.getAttribute('data-pid')===pid)control.disabled=state.pending||state.sent||state.blocked;});
      if(state.sent||state.blocked){var lockedText=document.getElementById('rd-'+pid);if(lockedText)lockedText.disabled=true;}
      var message=document.getElementById('rm-'+pid);if(message&&state.messageType===''){message.textContent='';message.className='revmessage';}
      saveOrderDraft();
    });
  });

  if (o.status==='complete' && timer&&!Object.keys(formState).some(function(pid){return formState[pid]&&(formState[pid].pending||formState[pid].sent); })){ clearInterval(timer); timer=null; }
  restoreOrderView(viewState);
  saveOrderDraft();
}

function submitRevision(pid){
  var state=formState[pid]||{opts:[],details:'',open:true,pending:false,sent:false,message:'',messageType:''};formState[pid]=state;
  if(state.pending||state.sent||state.blocked||state.stale||(state.uncertain&&!state.retryAllowed))return;
  if(state.requestMarker&&state.requestMarker!==revisionMarker(latestOrderData,pid)){state.stale=true;state.message='A newer order version is ready. Review it before sending these changes.';state.messageType='pending';lastRenderKey=null;render(latestOrderData);return;}
  var details=(document.getElementById('rd-'+pid)||{}).value||'';
  if(!state.opts.length&&!details.trim()){
    state.message='Choose a change type or describe what you want changed.';state.messageType='error';
    var emptyMessage=document.getElementById('rm-'+pid);if(emptyMessage){emptyMessage.textContent=state.message;emptyMessage.className='revmessage error';}
    var emptyField=document.getElementById('rd-'+pid);if(emptyField)emptyField.focus();return;
  }
  state.details=details;state.requestMarker=revisionMarker(latestOrderData,pid);state.pending=true;state.uncertain=true;state.retryChecked=false;state.retryAllowed=false;state.message='Sending your request…';state.messageType='pending';
  saveOrderDraft();
  var button=document.getElementById('rs-'+pid),message=document.getElementById('rm-'+pid);
  if(button){button.disabled=true;setControlLabel(button,'Sending…');button.setAttribute('aria-busy','true');}
  app.querySelectorAll('[data-pid]').forEach(function(control){if(control.getAttribute('data-pid')===pid)control.disabled=true;});
  var field=document.getElementById('rd-'+pid);if(field)field.disabled=true;
  if(message){message.textContent=state.message;message.className='revmessage pending';}
  boundedJson(FN + '/request-revision', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:path[1],proposal_id:pid,options:state.opts.slice(),details:details})}, ACTION_TIMEOUT)
    .then(function(j){
      state.pending=false;state.uncertain=false;
      if(j&&j.ok){state.sent=true;state.uncertain=false;state.message='Your change request was sent.';state.messageType='success';if(!timer)timer=setInterval(function(){refreshStageDurations();tick(false);},3500);tick(true);}
      else if(j&&j.reason==='no_revisions_left'){state.blocked=true;state.message='All included rounds of changes have been used. Contact support for help.';state.messageType='error';}
      else {state.message='Could not send your request. Your answers are still here; please try again.';state.messageType='error';}
      var currentButton=document.getElementById('rs-'+pid),currentMessage=document.getElementById('rm-'+pid);
      if(currentButton){currentButton.disabled=state.sent||state.blocked;setControlLabel(currentButton,state.sent?'Request sent':state.blocked?'No rounds left':'Send revision request');currentButton.removeAttribute('aria-busy');}
      app.querySelectorAll('[data-pid]').forEach(function(control){if(control.getAttribute('data-pid')===pid)control.disabled=state.sent||state.blocked;});
      var currentField=document.getElementById('rd-'+pid);if(currentField)currentField.disabled=state.sent||state.blocked;
      if(currentMessage){currentMessage.textContent=state.message;currentMessage.className='revmessage '+state.messageType;}
      saveOrderDraft();
    })
    .catch(function(error){
      state.pending=false;state.message=error&&error.name==='AbortError'?'No response arrived before the request timed out. Check the order before trying again; your answers are still here.':'Connection interrupted. Your answers are still here; please try again.';state.messageType='error';
      var currentButton=document.getElementById('rs-'+pid),currentMessage=document.getElementById('rm-'+pid);
      if(currentButton){currentButton.disabled=true;setControlLabel(currentButton,'Send revision request');currentButton.removeAttribute('aria-busy');}
      app.querySelectorAll('[data-pid]').forEach(function(control){if(control.getAttribute('data-pid')===pid)control.disabled=false;});
      var currentField=document.getElementById('rd-'+pid);if(currentField)currentField.disabled=false;
      if(currentMessage){currentMessage.textContent=state.message;currentMessage.className='revmessage error';}
      saveOrderDraft();
      if(!timer)timer=setInterval(function(){refreshStageDurations();tick(false);},3500);
      lastRenderKey=null;render(latestOrderData);
    });
}

function checkRevisionBeforeRetry(pid){
 var state=formState[pid];if(!state||!state.uncertain||state.pending||state.checking)return;
 if(state.retryChecked){state.retryAllowed=true;state.retryChecked=false;state.message='Retry enabled. Send again only if your first request was not received.';state.messageType='pending';lastRenderKey=null;render(latestOrderData);saveOrderDraft();return;}
 state.checking=true;state.message='Checking the latest order status…';state.messageType='pending';lastRenderKey=null;render(latestOrderData);
 boundedJson(FN+'/order-status?'+query,null,ORDER_STATUS_TIMEOUT).then(function(d){
  state.checking=false;if(!d||!d.order||!Array.isArray(d.proposals))throw new Error('Invalid order status');
  var marker=revisionMarker(d,pid);latestOrderData=d;
  if(marker!==state.requestMarker){state.stale=true;state.uncertain=false;state.message='The order changed since this request. Review the latest version before sending anything else.';state.messageType='pending';}
  else {state.retryChecked=true;state.message='No change is showing yet. If the first request did not arrive, choose “I understand — allow retry”.';state.messageType='pending';}
  lastRenderKey=null;render(d);saveOrderDraft();
 }).catch(function(){state.checking=false;state.message='Could not confirm the latest status. Your request remains paused; try checking again.';state.messageType='error';lastRenderKey=null;render(latestOrderData);});
}

var ORDER_STATUS_TIMEOUT=12000, ACTION_TIMEOUT=20000;
var REP = {
  people:     { c: 'rep-people',     fields: [['name', 'Name — e.g. Grace Mbeki'], ['role', 'Role — e.g. Chair']], cls: 'two-col' },
  programmes: { c: 'rep-programmes', fields: [['name', 'Programme — e.g. OpenARMS'], ['what', 'What it does, in a few words']], cls: 'two-col' },
  results:    { c: 'rep-results',    fields: [['figure', 'Figure — e.g. 412'], ['what', 'What — e.g. people supported'], ['when', 'When — e.g. 2024']], cls: 'three-col' },
  partners:   { c: 'rep-partners',   fields: [['v', 'Partner organisation you actually work with']], cls: '' },
  links:      { c: 'rep-links',      fields: [['v', 'https://your-site.org/annual-report']], cls: '' }
};
function repRow(kind, index) {
  var cfg = REP[kind];
  var row = document.createElement('div'); row.className = 'rep-row';
  var fields = document.createElement('div'); fields.className = 'rep-fields' + (cfg.cls ? (' ' + cfg.cls) : '');
  cfg.fields.forEach(function (f) {
    var inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = f[1]; inp.id='rep-'+kind+'-'+index+'-'+f[0];inp.setAttribute('data-k', f[0]);
    fields.appendChild(inp);
  });
  var x = document.createElement('button'); x.type = 'button'; x.className = 'rep-x'; x.setAttribute('aria-label', 'Remove'); x.innerHTML = '<svg aria-hidden="true" focusable="false" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></svg>';
  x.addEventListener('click', function () { if (row.parentNode) {row.parentNode.removeChild(row);renumberRep(kind);}rememberIntakeRows(); });
  row.appendChild(fields); row.appendChild(x);
  return row;
}
function addRep(kind) { var c = document.getElementById(REP[kind].c); if (c) {c.appendChild(repRow(kind,c.querySelectorAll('.rep-row').length));rememberIntakeRows();} }
function renumberRep(kind){var c=document.getElementById(REP[kind].c);if(!c)return;c.querySelectorAll('.rep-row').forEach(function(row,index){row.querySelectorAll('[data-k]').forEach(function(input){input.id='rep-'+kind+'-'+index+'-'+input.getAttribute('data-k');});});}
function collectRep(kind, includeEmpty) {
  var cfg = REP[kind], out = [];
  document.querySelectorAll('#' + cfg.c + ' .rep-row').forEach(function (r) {
    var o = {}, any = false;
    r.querySelectorAll('[data-k]').forEach(function (inp) {
      var v = inp.value.trim(); o[inp.getAttribute('data-k')] = v; if (v) any = true;
    });
    if (!any&&!includeEmpty) return;
    if (cfg.fields.length === 1 && cfg.fields[0][0] === 'v') out.push(o.v);
    else out.push(o);
  });
  return out;
}
function rememberIntakeRows(){
 if(orderDraftHydrating)return;
 if(!intakeRows)intakeRows={};
 Object.keys(INTAKE_LISTS).forEach(function(key){intakeRows[key]=collectRep(INTAKE_LISTS[key],true);});
 if(document.getElementById('intake-form'))intakeDraft=readIntake();
 saveOrderDraft();
}
function seedRepeaters() {
  Object.keys(REP).forEach(function (k) {
    var c = document.getElementById(REP[k].c);
    if (c && !c.children.length) addRep(k);
  });
}


var INTAKE_FIELDS={site_place:'w-place',site_venue:'w-venue',site_activity:'w-activity',last_delivery_what:'w-last-what',last_delivery_when:'w-last-when',local_trigger:'w-trigger',venue_escape:'w-venue-escape',proposal_type:'w-proposal-type',currency:'w-currency',response_language:'w-response-language',income_band:'w-income-band',legal_form:'w-legal',annual_income:'w-annual-income',accounts_period:'w-accounts',safeguarding_lead_name:'w-dsl-name',safeguarding_lead_role:'w-dsl-role',safeguarding_lead_training:'w-dsl-training',lived_experience_governance:'w-lived'};
var INTAKE_CHECKS={never_delivered:'w-never',safeguarding_policy:'w-sg-policy',bank_account_own_name:'w-bank',public_liability_insurance:'w-pli',board_independent:'w-board',no_conflicting_grant:'w-noconflict'};
var INTAKE_LISTS={key_people:'people',programmes:'programmes',results:'results',partnerships:'partners',extra_links:'links'};
function readIntake(){
 var facts={};Object.keys(INTAKE_FIELDS).forEach(function(k){facts[k]=document.getElementById(INTAKE_FIELDS[k]).value.trim();});facts.currency=(facts.currency==='other'?document.getElementById('w-currency-other').value.trim():facts.currency).toUpperCase();
 Object.keys(INTAKE_CHECKS).forEach(function(k){facts[k]=document.getElementById(INTAKE_CHECKS[k]).checked ? true : null;});
 Object.keys(INTAKE_LISTS).forEach(function(k){facts[k]=collectRep(INTAKE_LISTS[k]);});
 return {facts:facts,directions:document.getElementById('w-directions').value};
}
function syncPaidCurrency(){var other=document.getElementById('w-currency').value==='other';document.getElementById('paid-currency-other').hidden=!other;document.getElementById('w-currency-other').disabled=!other;document.getElementById('w-currency-other').required=other;}
function completeIntake(token){
 if(intakeSubmitting||intakeSaved)return;
 intakeDraft=readIntake();intakeSubmitting=true;intakeStatus='Saving your details…';
 saveOrderDraft();
 var button=document.getElementById('save-intake-button'),message=document.getElementById('intake-message');
 if(button){button.disabled=true;setControlLabel(button,intakeStatus);}if(message){message.textContent=intakeStatus;message.className='revmessage pending';}
 boundedJson(FN+'/complete-intake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,revision:intakeServerRevision,facts:intakeDraft.facts,directions:intakeDraft.directions})},ACTION_TIMEOUT)
  .then(function(result){
   intakeSubmitting=false;
   if(!result.ok){intakeStatus=(result.gaps||[]).join(' ')||result.message||'Please try again.';}
   else {intakeSaved=true;intakeStatus='Saved. Writing will start once the source checks finish.';if(orderDraft)orderDraft.intake=null;saveOrderDraft();}
   var currentButton=document.getElementById('save-intake-button'),currentMessage=document.getElementById('intake-message');
   if(currentButton){currentButton.disabled=intakeSaved;setControlLabel(currentButton,intakeSaved?'Details saved':'Save details and start writing');}
   if(currentMessage){currentMessage.textContent=intakeStatus;currentMessage.className='revmessage '+(intakeSaved?'success':result.ok?'success':'error');}
   applyDeferredOrderData();
  })
  .catch(function(error){
   intakeSubmitting=false;intakeStatus=error&&error.name==='AbortError'?'No response arrived before the save timed out. Your answers are kept here; check the order before trying again.':'Connection interrupted. Your answers are kept here; please try again.';
   var currentButton=document.getElementById('save-intake-button'),currentMessage=document.getElementById('intake-message');
   if(currentButton){currentButton.disabled=false;setControlLabel(currentButton,'Save details and start writing');}
   if(currentMessage){currentMessage.textContent=intakeStatus;currentMessage.className='revmessage error';}
   applyDeferredOrderData();
  });
}
function applyDeferredOrderData(){
 if(deferredOrderData){var data=deferredOrderData;deferredOrderData=null;render(data);}
 else tick(true);
}
function setupIntake(d){
 orderDraftHydrating=true;
 if(!intakeDraft&&orderDraft&&orderDraft.intake&&orderDraft.intake.revision===d.intake.revision){intakeDraft={facts:orderDraft.intake.facts||{},directions:orderDraft.intake.directions||''};intakeRows=orderDraft.intake.rows||null;intakeTouched=orderDraft.intake.touched||{};}
 var state=intakeDraft||{facts:d.intake.facts||{},directions:d.intake.directions||''};
 intakeServerRevision=d.intake.revision;
 var source=d.source_summary||{};['proposal_type','currency','response_language'].forEach(function(k){if(!state.facts[k]&&!intakeTouched[k]&&source[k])state.facts[k]=source[k];});
 Object.keys(INTAKE_FIELDS).forEach(function(k){document.getElementById(INTAKE_FIELDS[k]).value=state.facts[k]||'';});
 var requiredLanguage=source.response_language;if(['en','ar'].includes(requiredLanguage)){state.facts.response_language=requiredLanguage;document.getElementById('w-response-language').value=requiredLanguage;document.getElementById('w-response-language').disabled=true;document.getElementById('language-help').textContent='The issuer requires '+(requiredLanguage==='ar'?'Arabic':'English')+' for this submission.';}else if(/\p{Script=Arabic}/u.test(source.title||'')&&!state.facts.response_language){document.getElementById('w-response-language').required=true;document.getElementById('language-help').textContent='This source includes Arabic. Confirm English or Arabic for your documents; the source language alone does not decide the submission language.';}
 var currency=state.facts.currency||'',standard=['USD','LBP','EUR','GBP'].includes(currency);document.getElementById('w-currency').value=currency?(standard?currency:'other'):'';document.getElementById('w-currency-other').value=currency&&!standard?currency:'';syncPaidCurrency();
 if(source.proposal_type||source.currency)document.getElementById('source-field-note').textContent='Type and currency may be suggested from the source. Confirm both before saving.';
 document.getElementById('intake-message').textContent=intakeStatus;
 var saveButton=document.getElementById('save-intake-button');saveButton.disabled=intakeSubmitting||intakeSaved;setControlLabel(saveButton,intakeSubmitting?'Saving details…':intakeSaved?'Details saved':'Save details and start writing');
 document.getElementById('w-currency').addEventListener('change',syncPaidCurrency);document.getElementById('w-currency-other').addEventListener('input',function(){this.value=this.value.replace(/[^a-z]/gi,'').toUpperCase().slice(0,3);intakeTouched.currency=true;intakeDraft=readIntake();});
 Object.keys(INTAKE_CHECKS).forEach(function(k){document.getElementById(INTAKE_CHECKS[k]).checked=state.facts[k]===true;});
 document.getElementById('w-directions').value=state.directions;
 if(!intakeRows)intakeRows={};
 Object.keys(INTAKE_LISTS).forEach(function(k){var kind=INTAKE_LISTS[k],container=document.getElementById(REP[kind].c),rows=Array.isArray(intakeRows[k])?intakeRows[k]:(state.facts[k]||[]);intakeRows[k]=rows.slice();rows.forEach(function(value,index){var row=repRow(kind,index);row.querySelectorAll('[data-k]').forEach(function(input){input.value=typeof value==='string'?value:value[input.dataset.k]||'';});container.appendChild(row);});});
 seedRepeaters();
 [['add-people','people'],['add-programmes','programmes'],['add-results','results'],['add-partners','partners'],['add-links','links']].forEach(function(pair){document.getElementById(pair[0]).addEventListener('click',function(){addRep(pair[1]);});});
 var form=document.getElementById('intake-form');form.addEventListener('input',function(e){Object.keys(INTAKE_FIELDS).forEach(function(k){if(INTAKE_FIELDS[k]===e.target.id)intakeTouched[k]=true;});rememberIntakeRows();});form.addEventListener('change',function(e){Object.keys(INTAKE_FIELDS).forEach(function(k){if(INTAKE_FIELDS[k]===e.target.id)intakeTouched[k]=true;});rememberIntakeRows();});
 form.addEventListener('submit',function(e){e.preventDefault();completeIntake(d.order.token);});
 orderDraftHydrating=false;
 if(!intakeDraft&&orderDraft&&orderDraft.intake&&orderDraft.intake.revision!==d.intake.revision){
  var notice=document.createElement('div');notice.className='order-next';notice.setAttribute('role','status');notice.textContent='The source details changed since this draft was saved. Review your earlier answers before submitting.';
  var recover=document.createElement('button');recover.type='button';recover.className='revbtn';recover.textContent='Review saved draft';recover.addEventListener('click',function(){var saved=orderDraft&&orderDraft.intake;if(!saved)return;intakeDraft={facts:saved.facts||{},directions:saved.directions||''};intakeRows=saved.rows||null;intakeTouched=saved.touched||{};intakeServerRevision=d.intake.revision;lastRenderKey=null;render(d);saveOrderDraft();});notice.appendChild(recover);document.getElementById('paid-intake').prepend(notice);
 }
}

function tick(force){
  if(pollActive){if(force!==false)pollAgain=true;return;}
  pollActive=true;var requestSequence=++pollSequence,requestQuery=query;
  boundedJson(FN + '/order-status?' + requestQuery,null,ORDER_STATUS_TIMEOUT)
    .then(function(d){return ensureOrderDraftKey(d&&d.order&&d.order.token).then(function(){
      if(requestSequence!==pollSequence||requestQuery!==query)return;
      latestOrderData=d;var error=document.getElementById('order-poll-error');error.hidden=true;error.querySelector('span').textContent='';
      if(intakeSubmitting){deferredOrderData=d;return;}
      render(d);
    });})
    .catch(function(){
      if(requestSequence!==pollSequence||requestQuery!==query)return;
      var error=document.getElementById('order-poll-error');error.hidden=false;error.querySelector('span').textContent='Could not refresh this order. Your current details are still here; we will try again automatically.';
    })
    .finally(function(){pollActive=false;if(pollAgain){pollAgain=false;tick(true);}});
}
tick(true);
timer = setInterval(function(){refreshStageDurations();tick(false);}, 3500);
